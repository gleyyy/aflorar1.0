<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aflorar</title>
  <link rel="stylesheet" href="jardim.css">
  <link rel="stylesheet" href="global.css">
</head>
<body>

<header class="navbar">
  <div class="logo">Aflorar</div>

  <nav class="menu">
    <a href="inicio.html">🏠 Início</a>
    <a href="chat.html" >💼 Flora</a>
    <a href="estufa.html">⛺ Minha Estufa</a>
    <a href="jardim.html" class=active>🌿 Jardim</a>
  </nav>
  <div class="profile" id="btn-perfil">👤</div>
</header>

  <main class="scene">
    <div class="fence" id="fence"></div>
    <div class="page-indicator"></div>

    <div class="rock rock-left"></div>
    <div class="rock-left-small"></div>
    <div class="grass-tuft" style="top:22%; left:70px;"></div>
    <div class="grass-tuft" style="top:24%; left:80px;"></div>
    <div class="rock rock-right"></div>
    <div class="grass-tuft" style="top:52%; right:32px;"></div>
    <div class="grass-tuft" style="top:54%; right:48px;"></div>

    <div class="pond">
      <svg viewBox="0 0 260 200" preserveAspectRatio="none">
        <defs>
          <linearGradient id="pondGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#81D4FA"/>
            <stop offset="100%" stop-color="#4FC3F7"/>
          </linearGradient>
        </defs>
        <path d="M20,50 C60,10 140,0 180,35 C215,65 200,110 175,120 C210,130 200,170 150,180 C90,195 30,175 12,140 C-5,108 -10,90 20,50 Z" fill="url(#pondGrad)"/>
      </svg>
      <div class="lily" style="top:34%; left:26%;"></div>
      <div class="lily" style="top:56%; left:42%; width:16px; height:16px;"></div>
    </div>

    <div class="bush">
      <svg viewBox="0 0 220 140" preserveAspectRatio="none">
        <path d="M0,140 L0,70
                 C 8,50 22,55 30,42
                 C 36,26 54,20 68,30
                 C 78,10 104,8 116,26
                 C 128,10 154,12 162,32
                 C 176,22 196,30 198,50
                 C 210,52 220,68 214,84
                 L220,140 Z"
              fill="#4CAF50"/>
        <path d="M0,140 L0,90 C 20,78 40,84 55,72 C 75,60 100,60 118,72 C 140,58 170,64 185,80 C 200,74 216,88 214,104 L220,140 Z"
              fill="#43A047" opacity="0.55"/>
      </svg>
    </div>

    <div class="path-stone" style="width:22px; height:14px; bottom:14%; right:16%;"></div>
    <div class="path-stone" style="width:30px; height:18px; bottom:10%; right:12%;"></div>
    <div class="path-stone" style="width:26px; height:16px; bottom:6%; right:18%;"></div>
    <div class="path-stone" style="width:24px; height:15px; bottom:3%; right:9%;"></div>
    <div class="path-stone" style="width:20px; height:13px; bottom:8%; right:4%;"></div>
    <div class="path-stone" style="width:18px; height:12px; bottom:22%; right:24%;"></div>

    <div class="garden-grid" id="garden-grid"></div>

    <div class="side-buttons">
      <div class="side-btn" data-card="loja" title="Loja">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      </div>
      <div class="side-btn" data-card="cofre" title="Cofre">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="side-btn" data-card="config" title="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .33-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.33-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.33H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.33 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      </div>
    </div>

    <div class="nav-arrow prev" id="btn-prev">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="nav-arrow next" id="btn-next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <p>Carregando seu jardim...</p>
    </div>
  </main>

  <!-- Modal criar/editar canteiro -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <h2 id="modal-title">Novo canteiro</h2>
      <p class="sub" id="modal-sub">Dê um nome para o seu novo canteiro 🌱</p>

      <div class="field">
        <label for="input-nome">Nome do canteiro</label>
        <input type="text" id="input-nome" maxlength="30" placeholder="Ex: Rosas">
      </div>

      <div class="field" id="field-nivel" style="display:none;">
        <label>Nível do canteiro</label>
        <div class="level-picker" id="level-picker">
          <div class="level-star" data-level="1">1</div>
          <div class="level-star" data-level="2">2</div>
          <div class="level-star" data-level="3">3</div>
          <div class="level-star" data-level="4">4</div>
          <div class="level-star" data-level="5">5</div>
        </div>
      </div>

      <div class="modal-error" id="modal-error"></div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="btn-cancel">Cancelar</button>
        <button class="btn btn-primary" id="btn-save">Criar</button>
      </div>
    </div>
  </div>

  <!-- Side card (Loja / Cofre / Config placeholders) -->
  <div class="side-card" id="side-card">
    <div class="close-card" id="close-card">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </div>
    <h3 id="side-card-title">Título</h3>
    <p id="side-card-body">Conteúdo em breve.</p>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../Js/supabase.js"></script>
<script src="../Js/jardim.js"></script>
</body>
</html>
